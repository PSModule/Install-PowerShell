name: Action-Test

run-name: 'Action-Test - [${{ github.event.pull_request.title }} #${{ github.event.pull_request.number }}] by @${{ github.actor }}'

on:
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: '0 0 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  ActionTestBasic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
        version: ['latest', 'prerelease', '7.4.7', '7.5.0', '7.4.0-preview.5']
    runs-on: ${{ matrix.os }}
    name: '${{ matrix.os }} - [${{ matrix.version }}]'
    env:
      TestGitHubToken: ${{ github.token }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Action-Test
        uses: ./
        with:
          Version: ${{ matrix.version == 'prerelease' && 'latest' || matrix.version }}
          Prerelease: ${{ matrix.version == 'prerelease' && 'true' || 'false' }}

      - name: Verify installed version
        shell: pwsh
        run: |
          ./test/scripts/Verify-InstalledVersion.ps1 -RequestedVersion '${{ matrix.version }}' -GitHubToken '${{ env.TestGitHubToken }}'

  ActionTestTokenUseCases:
    name: 'ubuntu-latest - [Token use cases]'
    runs-on: ubuntu-latest
    env:
      TestGitHubToken: ${{ github.token }}
      TestLatestVersion: latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Action-Test (Default token behavior)
        uses: ./
        with:
          Version: ${{ env.TestLatestVersion }}

      - name: Verify default token behavior
        shell: pwsh
        run: |
          ./test/scripts/Verify-InstalledVersion.ps1 -RequestedVersion '${{ env.TestLatestVersion }}' -GitHubToken '${{ env.TestGitHubToken }}'

      - name: Action-Test (Explicit token input)
        uses: ./
        with:
          Version: ${{ env.TestLatestVersion }}
          Token: ${{ env.TestGitHubToken }}

      - name: Verify explicit token input behavior
        shell: pwsh
        run: |
          ./test/scripts/Verify-InstalledVersion.ps1 -RequestedVersion '${{ env.TestLatestVersion }}' -GitHubToken '${{ env.TestGitHubToken }}'

      - name: Action-Test (Anonymous mode)
        uses: ./
        with:
          Version: ${{ env.TestLatestVersion }}
          Token: ''

      - name: Verify anonymous mode behavior
        shell: pwsh
        run: |
          ./test/scripts/Verify-InstalledVersion.ps1 -RequestedVersion '${{ env.TestLatestVersion }}'
