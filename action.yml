name: Install PowerShell
description: |
  Install a specific version, or the latest stable version, of PowerShell Core
  on any GitHub runner (Linux, macOS, Windows).
  Skips the install if the requested version is already present.
author: PSModule
branding:
  icon: terminal
  color: purple

inputs:
  Version:
    description: |
      PowerShell version to install (e.g. `7.4.1` or `7.4.0-preview.5`).
      Defaults to install the latest stable release.
      Prerelease versions are supported (e.g. `7.4.0-preview.5`, `7.5.0-rc.1`).
    required: false
    default: 'latest'
  Prerelease:
    description: |
      Install a prerelease version of PowerShell.
      When `true` and `Version` is `latest`, installs the latest prerelease.
      Similar to the `-Prerelease` switch on `Install-PSResource`.
    required: false
    default: 'false'
  Token:
    description: |
      Token used for GitHub API calls.
      Defaults to github.token. Set to an empty string for anonymous API access.
    required: false
    default: ${{ github.token }}
  Host:
    description: |
      GitHub host used by gh CLI for API calls.
      Use github.com for GitHub.com or your GHES hostname.
    required: false
    default: github.com

runs:
  using: composite
  steps:
    - name: Install PowerShell (Linux)
      if: runner.os == 'Linux'
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        REQUESTED_VERSION: ${{ inputs.Version }}
        PRERELEASE: ${{ inputs.Prerelease }}
        GITHUB_TOKEN: ${{ inputs.Token }}
        GH_TOKEN: ${{ inputs.Token }}
        GH_HOST: ${{ inputs.Host }}
      run: bash ./scripts/linux/install.sh # zizmor: ignore[github-env] GITHUB_PATH writes use hardcoded install dirs, not user input

    - name: Install PowerShell (macOS)
      if: runner.os == 'macOS'
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        REQUESTED_VERSION: ${{ inputs.Version }}
        PRERELEASE: ${{ inputs.Prerelease }}
        GITHUB_TOKEN: ${{ inputs.Token }}
        GH_TOKEN: ${{ inputs.Token }}
        GH_HOST: ${{ inputs.Host }}
      run: bash ./scripts/macos/install.sh # zizmor: ignore[github-env] GITHUB_PATH writes use hardcoded install dirs, not user input

    - name: Install PowerShell (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      working-directory: ${{ github.action_path }}
      env:
        REQUESTED_VERSION: ${{ inputs.Version }}
        PRERELEASE: ${{ inputs.Prerelease }}
        GITHUB_TOKEN: ${{ inputs.Token }}
      run: ./scripts/windows/install.ps1 # zizmor: ignore[github-env] GITHUB_PATH writes use hardcoded install dirs, not user input
